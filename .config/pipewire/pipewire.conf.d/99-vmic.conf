# Virtual mic for applications: the app feed, input.vmic:playback is where the
# processed mic and the synth land (all wired up by links.rs). A filter-chain
# makes a sink+source pair, and it's the source node (a dedicated Audio/Source
# device) that applications record from. A Pulse null-sink would collapse this
# to one node, but its source is only a monitor, which apps don't reliably
# expose as an input device.
context.modules = [
  { name = libpipewire-module-filter-chain
    args = {
      node.name        = "vmic"
      node.description = "vmic"
      media.class      = "Virtual"

      capture.props = {
          media.class = "Audio/Sink"
          audio.channels = 2
          audio.position = [ FL FR ]
      }

      playback.props = {
        media.class = "Audio/Source"
      }

      filter.graph = {
        inputs  = [ "in1:In" "in2:In" ]
        outputs = [ "outL:Out" "outR:Out" ]

        nodes = [
          { name = in1  type = builtin label = copy }
          { name = in2  type = builtin label = copy }

          { name = outL type = builtin label = copy }
          { name = outR type = builtin label = copy }
        ]

        links = [
          { output = "in1:Out" input = "outL:In" }
          { output = "in2:Out" input = "outR:In" }
        ]
      }
    }
  }
]